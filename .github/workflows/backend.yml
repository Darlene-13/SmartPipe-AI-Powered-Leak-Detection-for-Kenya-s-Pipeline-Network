name: Deploy Spring Backend

on:
  push:
    branches: [main]
    paths:
      - 'LeakDetectionApplication/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}

      - name: Build JAR
        run: cd LeakDetectionApplication && mvn package -DskipTests

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v21
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: leak-detection-backend
          environment_name: Leak-detection-backend-env
          region: us-east-1
          version_label: ${{ github.sha }}
          deployment_package: LeakDetectionApplication/target/LeakDetectionApplication-0.0.1-SNAPSHOT.jar