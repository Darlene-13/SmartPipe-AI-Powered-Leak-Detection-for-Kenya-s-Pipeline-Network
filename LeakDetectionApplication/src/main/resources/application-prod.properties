
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=40000
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.pool-name=LeakDetectionPool
spring.datasource.hikari.max-lifetime=1200000

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=false

server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION}

spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=${GROQ_API_BASE_URL}
spring.ai.openai.chat.options.model=${GROQ_MODEL:llama-3.3-70b-versatile}

mqtt.broker-url=${MQTT_BROKER_URL}
mqtt.username=${MQTT_USERNAME}
mqtt.password=${MQTT_PASSWORD}
mqtt.topics.sensor-data=pipeline/sensors/node
mqtt.topics.led-status=pipeline/led/status
mqtt.topics.alerts=pipeline/alerts/default

ml-service.base-url=${ML_SERVICE_URL:http://localhost:5000}
ml-service.timeout-seconds=${ML_TIMEOUT_SECONDS:10}

redis.cache.ttl-seconds=${REDIS_CACHE_TTL_SECONDS:300}

websocket.endpoint=/ws/alerts

app.cors.allowed-origins=https://main.d1cp8t2c10axin.amplifyapp.com


logging.level.root=INFO
logging.level.io.github.darlene=INFO
logging.level.org.springframework.integration.mqtt=WARN
logging.level.com.zaxxer.hikari=WARN