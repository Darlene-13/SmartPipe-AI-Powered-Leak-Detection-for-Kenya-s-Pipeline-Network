
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
ml-service.base-url=${ML_SERVICE_BASE_URL:http://localhost:5000}
ml-service.timeout-seconds=${ML_TIMEOUT_SECONDS:10}


# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${REDIS_SSL}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION}

# MQTT
mqtt.broker.url=${MQTT_BROKER_URL}
mqtt.username=${MQTT_USERNAME}
mqtt.password=${MQTT_PASSWORD}
mqtt.topic=${MQTT_TOPIC}

# Grok via Spring AI (uses OpenAI-compatible format)
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=${GROQ_MODEL}

# ML Service
ml.service.url=${ML_SERVICE_URL}

# Replay
replay.interval.ms=${REPLAY_INTERVAL_MS}
replay.device.id=${REPLAY_DEVICE_ID}